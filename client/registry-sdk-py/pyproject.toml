[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signet-registry"
version = "0.1.0"
description = "Signet registry Python SDK: verify-before-load helpers (envelope digests, detached signatures, RFC 6962 inclusion proofs, artifact re-hashing) and a small read client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=45,<47"]

[project.optional-dependencies]
dev = ["pytest>=8.4", "pip-audit>=2.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/signet_registry"]
