name: Release

on:
  push:
    branches: [main]
  # Re-publish artifacts for an existing tag (e.g. after infra/secrets are set
  # up). release-please does not run on dispatch; the tag must already exist.
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish (e.g. v0.1.1)
        required: true
        type: string
      dry_run:
        description: Resolve the tag without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR: no cloud account required. Images and the OCI chart publish under
  # ghcr.io/<owner>/signet/… with the workflow's GITHUB_TOKEN, then get
  # keyless (Sigstore) signatures, build-provenance attestations, and SPDX
  # SBOMs as usual. Set SIGNET_IMAGE_NAMESPACE / SIGNET_CHART_REPOSITORY repo
  # variables only if you mirror the pipeline to another registry layout.
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.SIGNET_IMAGE_NAMESPACE || format('{0}/signet', github.repository_owner) }}
  CHART_REPOSITORY: ${{ vars.SIGNET_CHART_REPOSITORY || 'charts' }}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    env:
      # Optional GitHub App for release-please. With an App token, the release
      # PR, tag, and release are app-authored and DO trigger other workflow
      # runs (release PR CI, tag-driven workflows) — the default GITHUB_TOKEN
      # suppresses those triggers. Configure with repository secrets
      # RELEASE_APP_ID + RELEASE_APP_PRIVATE_KEY (App needs contents: write
      # and pull-requests: write, installed on this repository). Without the
      # secrets the job falls back to GITHUB_TOKEN and stays functional.
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app-token
        if: env.RELEASE_APP_ID != ''
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scope the token to only what release-please needs (contents + PRs),
          # rather than inheriting the app's blanket installation permissions.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # On a release, publish each component image and the Helm chart to GHCR
  # (ghcr.io/<owner>/signet/…) using the workflow's GITHUB_TOKEN — no cloud
  # account, no long-lived credentials. Everything is signed keyless via
  # Sigstore, attested with GitHub build provenance, and shipped with SPDX
  # SBOMs. Also runnable manually to publish an existing tag
  # (workflow_dispatch). Deployment repos pin the released chart version and
  # image digests and apply them.
  publish:
    needs: [release-please]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true'
       || github.event_name == 'workflow_dispatch' && inputs.dry_run != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      # Tag (v-prefixed). Push -> release-please tag; dispatch -> input.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release-please.outputs.tag_name }}
    steps:
      - name: Validate version input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version input '${RELEASE_TAG}': expected a tag like v0.1.2" >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.4

      # Pinned release binaries with SHA256 verification (no "latest", no
      # unverified binary), mirroring the grype install in security.yml.
      - name: Install release signing tools (cosign, syft; SHA256-verified)
        shell: bash
        run: |
          set -euo pipefail
          COSIGN_VERSION="v3.1.3"
          COSIGN_SHA256="4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o /tmp/cosign
          echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          install -m 0755 /tmp/cosign /usr/local/bin/cosign
          SYFT_VERSION="v1.54.1"
          SYFT_SHA256="c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47"
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" -o /tmp/syft.tar.gz
          echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f /tmp/syft.tar.gz syft
          cosign version
          syft version

      - name: Log in to GHCR
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" --username "${{ github.actor }}" --password-stdin

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Publish component images
        id: images
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          get_digest() {
            local image=$1 digest
            for _ in $(seq 1 12); do
              digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest' 2>/dev/null || true)"
              if [[ "$digest" == sha256:* ]]; then echo "$digest"; return; fi
              sleep 5
            done
            echo "Unable to resolve registry digest for $image" >&2
            return 1
          }

          # GHCR has no immutable-tag enforcement; keep the no-overwrite
          # guarantee at the workflow level (a tag that already exists fails
          # the release instead of being silently replaced).
          require_absent_tag() {
            local image=$1
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing image tag: $image" >&2
              return 1
            fi
          }

          specs=(
            "api|service/api/Dockerfile"
            "mcp|service/mcp/Dockerfile"
            "webapp|service/webapp/knowledge-manager/Dockerfile"
            "tessera-sidecar|service/tessera-sidecar/Dockerfile"
          )

          images='{}'
          for spec in "${specs[@]}"; do
            IFS='|' read -r target dockerfile <<<"$spec"
            repository="$IMAGE_NAMESPACE/$target"
            image="$REGISTRY/$repository"
            require_absent_tag "$image:$version"
            docker buildx build --platform linux/amd64 --file "$dockerfile" \
              --tag "$image:$version" \
              --provenance=mode=max --sbom=true --push .
            digest="$(get_digest "$image:$version")"

            # Boot smoke against the pushed digest: build-time success did
            # not catch the v0.1.30/31 runtime breaks (missing registry deps,
            # incompatible OTel pairing), so every release proves /healthz.
            host_port=0; container_port=0; smoke_env=()
            case "$target" in
              api) host_port=13100; container_port=3100; smoke_env=(-e NODE_ENV=test -e LOG_LEVEL=silent -e DATABASE_URL=:memory: -e REGISTRY_GRAPH_BACKEND=memory) ;;
              mcp) host_port=13000; container_port=3000; smoke_env=(-e NODE_ENV=test -e LOG_LEVEL=silent -e DATABASE_URL=:memory: -e REGISTRY_GRAPH_BACKEND=memory -e REGISTRY_OBJECTS_DIR=/tmp/objects) ;;
              webapp) host_port=13200; container_port=3200; smoke_env=(-e NODE_ENV=test -e PORT=3200) ;;
              tessera-sidecar) host_port=13400; container_port=3400; smoke_env=(-e NODE_ENV=test -e TESSERA_SIDECAR_BUCKET=smoke -e PORT=3400) ;;
              *) echo "no boot smoke defined for $target" >&2; exit 1 ;;
            esac
            docker run -d --name "smoke-$target" "${smoke_env[@]}" -p "$host_port:$container_port" "$image@$digest" >/dev/null
            smoke_ok=false
            for _ in $(seq 1 20); do
              sleep 1
              if curl -sf -o /dev/null "http://127.0.0.1:$host_port/healthz"; then smoke_ok=true; break; fi
            done
            if [[ "$smoke_ok" != true ]]; then
              echo "boot smoke failed for $target" >&2
              docker logs "smoke-$target" >&2 || true
              docker rm -f "smoke-$target" >/dev/null || true
              exit 1
            fi
            docker rm -f "smoke-$target" >/dev/null
            echo "boot smoke ok: $target"
            images="$(jq --arg target "$target" --arg repository "$repository" --arg digest "$digest" \
              '. + {($target): {repository: $repository, reference: ($repository + "@" + $digest), digest: $digest}}' <<<"$images")"
          done
          echo "$images" > images.json
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Keyless (GitHub OIDC -> Fulcio/Rekor) signatures over every released
      # image, and the checksums file that feeds the GitHub provenance
      # attestation (format: "<hex-sha256>  <subject-name>" per line).
      - name: Sign component images and prepare attestation subjects (keyless)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/attest
          : > dist/attest/images.checksums
          for target in api mcp webapp tessera-sidecar; do
            repository="$(jq -r --arg t "$target" '.[$t].repository' images.json)"
            digest="$(jq -r --arg t "$target" '.[$t].digest' images.json)"
            image="$REGISTRY/$repository"
            cosign sign --yes "$image@$digest"
            printf '%s  %s\n' "${digest#sha256:}" "$image" >> dist/attest/images.checksums
            echo "signed $image@$digest"
          done

      # SPDX SBOMs per image: attached to the registry via cosign (verifiable
      # with cosign verify-attestation) and uploaded as release assets.
      - name: Generate image SBOMs and attach them to the registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sbom
          for target in api mcp webapp tessera-sidecar; do
            repository="$(jq -r --arg t "$target" '.[$t].repository' images.json)"
            digest="$(jq -r --arg t "$target" '.[$t].digest' images.json)"
            image="$REGISTRY/$repository"
            syft "$image@$digest" --output spdx-json > "dist/sbom/$target.spdx.json"
            cosign attest --yes --type spdxjson --predicate "dist/sbom/$target.spdx.json" "$image@$digest"
          done

      - name: Attest image provenance (GitHub attestations)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/attest/images.checksums

      - name: Publish Helm chart
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" --username "${{ github.actor }}" --password-stdin
          helm package charts/signet --version "$version" --app-version "$version" --destination dist
          # helm push to oci://<registry>/<CHART_REPOSITORY> publishes to
          # <CHART_REPOSITORY>/<chart name>; refuse an existing version
          # (GHCR does not enforce immutable tags itself).
          require_absent_chart() {
            local ref="oci://$REGISTRY/$IMAGE_NAMESPACE/$CHART_REPOSITORY/signet"
            if helm show chart "$ref" --version "$version" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing chart version: $ref:$version" >&2
              return 1
            fi
          }
          require_absent_chart
          push_output="$(helm push "dist/signet-$version.tgz" "oci://$REGISTRY/$IMAGE_NAMESPACE/$CHART_REPOSITORY" 2>&1)"
          printf '%s\n' "$push_output"
          chart_digest="$(printf '%s\n' "$push_output" | sed -n 's/^Digest: //p' | tr -d '[:space:]')"
          if [[ "$chart_digest" != sha256:* ]]; then
            echo "Unable to resolve the pushed chart digest." >&2
            exit 1
          fi
          echo "CHART_DIGEST=$chart_digest" >> "$GITHUB_ENV"

      - name: Sign chart (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "$REGISTRY/$IMAGE_NAMESPACE/$CHART_REPOSITORY/signet@$CHART_DIGEST"

      - name: Attest chart provenance (GitHub attestations)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.CHART_REPOSITORY }}/signet
          subject-digest: ${{ env.CHART_DIGEST }}

      - name: Publish release manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          tag="$RELEASE_TAG"
          jq -n \
            --arg version "$version" \
            --arg tag "$tag" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg chart "oci://$REGISTRY/$IMAGE_NAMESPACE/$CHART_REPOSITORY/signet:$version" \
            --slurpfile images images.json \
            '{version: $version, tag: $tag, sourceSha: $sourceSha, chart: $chart, images: $images[0]}' \
            > release-manifest.json
          # Keyless signature (with its bundle) over the manifest, so the
          # digest pinning consumers can be verified end to end.
          cosign sign-blob --yes --bundle release-manifest.sigstore.json release-manifest.json
          sha256sum release-manifest.json release-manifest.sigstore.json dist/sbom/*.spdx.json > SHA256SUMS
          # SBOMs may be re-uploaded on a dispatch re-run; the signed
          # manifest/bundle/checksums must never be silently replaced — an
          # existing asset fails the job and requires an explicit operator
          # delete first.
          gh release upload "$tag" dist/sbom/*.spdx.json --clobber
          gh release upload "$tag" release-manifest.json SHA256SUMS release-manifest.sigstore.json
