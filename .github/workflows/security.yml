name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan so newly disclosed CVEs surface even without code changes.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (static analysis)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          # No root package.json: the repo is a monorepo of independent npm
          # packages, so CodeQL analyzes source directly without a build step.
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history: gitleaks verifies no credential was ever committed, not
      # just in the current tree. Known false positives (the restore-drill
      # runbook's local compose default) are narrowed in .gitleaks.toml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
