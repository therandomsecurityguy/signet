name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  service-api:
    name: service/api (registry core + management plane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            service/api/package-lock.json
            service/registry/package-lock.json
            service/tessera-sidecar/package-lock.json

      # service/registry declares its own dependencies; the API test suite
      # imports registry core modules, so registry deps must be installed
      # for module resolution to work.
      - name: Install registry core dependencies
        run: npm ci
        working-directory: service/registry

      # The transparency reconciliation e2e boots the real sidecar app, so
      # its dependencies must resolve too.
      - name: Install tessera sidecar dependencies
        run: npm ci
        working-directory: service/tessera-sidecar

      - name: Install API dependencies
        run: npm ci
        working-directory: service/api

      - name: Typecheck
        run: npm run typecheck
        working-directory: service/api

      - name: Lint
        run: npm run lint
        working-directory: service/api

      - name: Test
        run: npx vitest run
        working-directory: service/api

      - name: Production build boot smoke
        run: |
          npm run build
          ln -sfn "$PWD/../registry/node_modules" ../node_modules
          NODE_ENV=test LOG_LEVEL=silent DATABASE_URL=:memory: REGISTRY_GRAPH_BACKEND=memory PORT=3199 \
            node dist/service/api/src/app/main.js > /tmp/api-boot.log 2>&1 &
          pid=$!
          rc=1
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf -o /dev/null http://127.0.0.1:3199/healthz; then rc=0; break; fi
          done
          kill $pid 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then cat /tmp/api-boot.log; exit 1; fi
        working-directory: service/api

  service-mcp:
    name: service/mcp (AI-facing read plane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            service/mcp/package-lock.json
            service/registry/package-lock.json

      - name: Install registry core dependencies
        run: npm ci
        working-directory: service/registry

      - name: Install MCP dependencies
        run: npm ci
        working-directory: service/mcp

      - name: Typecheck
        run: npm run typecheck
        working-directory: service/mcp

      - name: Lint
        run: npm run lint
        working-directory: service/mcp

      - name: Test
        run: npx vitest run
        working-directory: service/mcp

      - name: Production build boot smoke
        run: |
          npm run build
          ln -sfn "$PWD/../registry/node_modules" ../node_modules
          NODE_ENV=test LOG_LEVEL=silent DATABASE_URL=:memory: REGISTRY_GRAPH_BACKEND=memory REGISTRY_OBJECTS_DIR=/tmp/objects PORT=3099 \
            node dist/service/mcp/src/app/main.js > /tmp/mcp-boot.log 2>&1 &
          pid=$!
          rc=1
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf -o /dev/null http://127.0.0.1:3099/healthz; then rc=0; break; fi
          done
          kill $pid 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then cat /tmp/mcp-boot.log; exit 1; fi
        working-directory: service/mcp

  service-mcp-cognitive:
    name: service/mcp (cognitive layer enabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            service/mcp/package-lock.json
            service/registry/package-lock.json

      - name: Install registry core dependencies
        run: npm ci
        working-directory: service/registry

      - name: Install MCP dependencies
        run: npm ci
        working-directory: service/mcp

      - name: Typecheck
        run: npm run typecheck
        working-directory: service/mcp

      - name: Test (cognitive layer enabled)
        run: npx vitest run
        working-directory: service/mcp
        env:
          COGNITIVE_LAYER_ENABLED: 'true'

  # The human-facing webapp previously had no CI coverage. It is a canonical
  # boundary and the registry's browser surface, so it gets the same gate as
  # the other services: typecheck, lint, tests, and a production-build boot
  # smoke. Its tests are self-contained (the registry API is mocked), so no
  # cross-package installs are needed. Browser-only behavior (tabs,
  # clipboard, list filtering, graph rendering) additionally runs in a real
  # headless Chromium via the gated interaction smoke.
  knowledge-manager:
    name: service/webapp/knowledge-manager (human-facing webapp)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/webapp/knowledge-manager/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: service/webapp/knowledge-manager

      - name: Typecheck
        run: npm run typecheck
        working-directory: service/webapp/knowledge-manager

      - name: Lint
        run: npm run lint
        working-directory: service/webapp/knowledge-manager

      - name: Test
        run: npx vitest run
        working-directory: service/webapp/knowledge-manager

      # Browser-level interactions in real headless Chromium; a separate
      # step so the unit suite stays browser-free.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: service/webapp/knowledge-manager

      - name: Interaction smoke (headless chromium)
        run: npm run test:interactions
        working-directory: service/webapp/knowledge-manager

      - name: Production build boot smoke
        run: |
          npm run build
          NODE_ENV=test LOG_LEVEL=silent PORT=3299 DATABASE_URL=file:/tmp/webapp-boot.db \
            node dist/src/server/main.js > /tmp/webapp-boot.log 2>&1 &
          pid=$!
          rc=1
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf -o /dev/null http://127.0.0.1:3299/healthz; then rc=0; break; fi
          done
          kill $pid 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then cat /tmp/webapp-boot.log; exit 1; fi
        working-directory: service/webapp/knowledge-manager

  tessera-sidecar:
    name: service/tessera-sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/tessera-sidecar/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: service/tessera-sidecar

      - name: Typecheck
        run: npm run typecheck
        working-directory: service/tessera-sidecar

  tessera-runtime:
    name: service/tessera-runtime (Go build, vet, govulncheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: service/tessera-runtime/go.mod
          cache-dependency-path: service/tessera-runtime/go.sum

      - name: Build and vet
        run: go build ./... && go vet ./...
        working-directory: service/tessera-runtime

      # Fixture-backed signed-note tests (shared oracle with the registry's
      # TypeScript tests) plus a hermetic note round trip.
      - name: Test
        run: go test ./...
        working-directory: service/tessera-runtime

      # Vulnerability scan pinned by version; the job fails on findings in
      # called code paths (remediation: bump the flagged module).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        working-directory: service/tessera-runtime

  shacl-runtime:
    name: service/shacl-runtime (SHACL-AF runtime)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: service/shacl-runtime/.python-version

      - name: Install dependencies (hash-pinned)
        run: python -m pip install --require-hashes -r service/shacl-runtime/requirements.txt -r service/shacl-runtime/requirements-dev.txt

      - name: Test
        run: python -m pytest tests -q
        working-directory: service/shacl-runtime

      - name: Vulnerability audit
        run: python -m pip_audit -r service/shacl-runtime/requirements.txt -r service/shacl-runtime/requirements-dev.txt

  registry-sdk-py:
    name: client/registry-sdk-py (Python SDK)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: client/registry-sdk-py/.python-version

      - name: Install dependencies (hash-pinned)
        run: python -m pip install --require-hashes -r client/registry-sdk-py/requirements-dev.txt

      - name: Install package
        run: python -m pip install -e client/registry-sdk-py --no-deps

      - name: Test
        run: python -m pytest tests -q
        working-directory: client/registry-sdk-py

      - name: Vulnerability audit
        run: python -m pip_audit -r client/registry-sdk-py/requirements-dev.txt

  registry-sdk:
    name: client/registry-sdk (typed read-first SDK)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/registry-sdk/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client/registry-sdk

      - name: Typecheck
        run: npm run typecheck
        working-directory: client/registry-sdk

      - name: Lint
        run: npm run lint
        working-directory: client/registry-sdk

      - name: Test
        run: npx vitest run
        working-directory: client/registry-sdk

      - name: Build
        run: npm run build
        working-directory: client/registry-sdk

  registry-cli:
    name: client/registry-cli (operator CLI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/registry-cli/package-lock.json
            service/api/package-lock.json
            service/mcp/package-lock.json
            service/registry/package-lock.json

      # The bootstrap integration test imports service/api and service/mcp
      # source, which declare their own dependencies (and service/api and
      # service/mcp import service/registry). Install all of them so module
      # resolution works.
      - name: Install registry core dependencies
        run: npm ci
        working-directory: service/registry

      - name: Install API dependencies
        run: npm ci
        working-directory: service/api

      - name: Install MCP dependencies
        run: npm ci
        working-directory: service/mcp

      - name: Install CLI dependencies
        run: npm ci
        working-directory: client/registry-cli

      - name: Typecheck
        run: npm run typecheck
        working-directory: client/registry-cli

      - name: Lint
        run: npm run lint
        working-directory: client/registry-cli

      - name: Test
        run: npx vitest run
        working-directory: client/registry-cli

      - name: Build
        run: npm run build
        working-directory: client/registry-cli

  e2e:
    name: service/api e2e (live SPARQL against Fuseki)
    runs-on: ubuntu-latest
    services:
      fuseki:
        image: stain/jena-fuseki@sha256:b1d0c96f19adddef417520184471ac816cf36c6e72936a88ea02b29f4305929a # 5.1.0
        env:
          ADMIN_PASSWORD: admin
          FUSEKI_DATASET_1: registry
        ports:
          - 3030:3030
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            service/api/package-lock.json
            service/registry/package-lock.json

      - name: Install registry core dependencies
        run: npm ci
        working-directory: service/registry

      - name: Install API dependencies
        run: npm ci
        working-directory: service/api

      - name: Wait for Fuseki
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3030/$/ping > /dev/null; then
              echo "Fuseki is up"
              exit 0
            fi
            sleep 2
          done
          echo "Fuseki did not become ready in time"
          exit 1

      - name: Run live SPARQL e2e
        run: npm run test:live-sparql
        working-directory: service/api
        env:
          REGISTRY_SPARQL_QUERY_URL: http://localhost:3030/registry/sparql
          REGISTRY_SPARQL_UPDATE_URL: http://localhost:3030/registry/update
          REGISTRY_SPARQL_USERNAME: admin
          REGISTRY_SPARQL_PASSWORD: admin

  e2e-postgres:
    name: e2e persistence (Postgres api keys and audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea # 16-alpine
        env:
          POSTGRES_PASSWORD: signet
          POSTGRES_DB: signet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            service/api/package-lock.json
            service/mcp/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: service/api

      - name: Run API persistence e2e (migrates the database)
        run: npm run test:postgres
        working-directory: service/api
        env:
          TEST_POSTGRES_URL: postgresql://postgres:signet@localhost:5432/signet

      - name: Install MCP dependencies
        run: npm ci
        working-directory: service/mcp

      - name: Run MCP persistence e2e against the API-migrated database
        run: npm run test:postgres
        working-directory: service/mcp
        env:
          TEST_POSTGRES_URL: postgresql://postgres:signet@localhost:5432/signet

