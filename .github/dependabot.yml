version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/service/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # TypeScript 6.x and 7.x are not yet installable across the toolchain:
    # @typescript-eslint (incl. latest 8.71.2) declares peer typescript
    # ">=4.8.4 <6.1.0" (blocks 7.x), and openapi-typescript declares
    # peer typescript "^5.x" (blocks 6.x for SDK codegen; upstream #146).
    # Revisit when those projects ship support (see upstream #117, upstream #146).
    #
    # @opentelemetry/sdk-trace-base (latest 2.12.0) declares
    # peer @opentelemetry/api ">=1.3.0 <1.10.0", so 1.10.x cannot install
    # alongside the pinned SDK (npm ci ERESOLVE; upstream #264). Revisit when a
    # sdk-trace-base release widens the peer range.
    # OTel packages move together (sdk/api peer ranges; the v0.1.31 exporter
    # incident); minor/patch land as a single PR.
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        versions: ["6.x", "7.x"]
      - dependency-name: "@opentelemetry/api"
        versions: ["1.10.x"]
      # The exporter's 0.3xx line (0.300 crashes at module load with api 1.9;
      # 0.301 requires api >=1.10) is blocked until @opentelemetry/api can
      # move past 1.9, which sdk-trace-base's <1.10.0 peer range prevents
      # (upstream #264, #295, #348, #350). Revisit when the SDK widens it.
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        versions: [">= 0.224.0"]

  - package-ecosystem: "npm"
    directory: "/service/mcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # OTel packages move together (sdk/api peer ranges; the v0.1.31 exporter
    # incident); minor/patch land as a single PR.
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        versions: ["6.x", "7.x"]
      # See the /service/api note: the exporter's 0.3xx line is blocked until
      # @opentelemetry/api can move past 1.9 (sdk-trace-base peer range).
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        versions: [">= 0.224.0"]
      # Same constraint as /service/api: sdk-trace-base pins the api peer
      # below 1.10 (npm ci ERESOLVE; upstream #295).
      - dependency-name: "@opentelemetry/api"
        versions: ["1.10.x"]

  - package-ecosystem: "npm"
    directory: "/service/registry"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Sigstore packages move together (bundle/core version pairing).
    groups:
      sigstore:
        patterns:
          - "@sigstore/*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/service/tessera-sidecar"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      - dependency-name: "typescript"
        versions: ["6.x", "7.x"]

  - package-ecosystem: "npm"
    directory: "/service/webapp/knowledge-manager"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      - dependency-name: "typescript"
        versions: ["6.x", "7.x"]

  - package-ecosystem: "npm"
    directory: "/client/registry-sdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # ESLint 10 no longer ships @eslint/js transitively, so eslint and
    # @eslint/js must move together or install/lint break (upstream #200).
    groups:
      eslint-toolchain:
        patterns:
          - "eslint"
          - "@eslint/js"
    ignore:
      - dependency-name: "typescript"
        versions: ["6.x", "7.x"]

  - package-ecosystem: "npm"
    directory: "/client/registry-cli"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # ESLint 10 no longer ships @eslint/js transitively, so eslint and
    # @eslint/js must move together or install/lint break (upstream #200).
    groups:
      eslint-toolchain:
        patterns:
          - "eslint"
          - "@eslint/js"
      # Sigstore packages move together (bundle/core version pairing).
      sigstore:
        patterns:
          - "@sigstore/*"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        versions: ["6.x", "7.x"]

  - package-ecosystem: "docker"
    directory: "/service/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/service/mcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/service/tessera-sidecar"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/service/webapp/knowledge-manager"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/modules/signet-data"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/modules/signet-eks"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Helm provider v3 changed helm_release set/set_list/set_sensitive from
    # nested blocks to attributes and reshaped the provider config, so this
    # module (and any provider config generated in the environment repo) is v2-only.
    # Widening to 3.x fails terraform validate (upstream #176). Revisit with a
    # deliberate v3 migration.
    ignore:
      - dependency-name: "hashicorp/helm"
        versions: ["3.x"]

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/modules/signet-registry"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/modules/registry-tessera-aurora"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/modules/registry-tessera-s3"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    # init/analyze/upload-sarif must run the same codeql-action version, or
    # CodeQL aborts with "Loaded a configuration file for version X, but
    # running version Y". Group them so they bump together (see upstream #199).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
