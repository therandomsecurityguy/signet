services:
  mcp:
    init: true
    tty: true
    stdin_open: true
    stop_grace_period: 5s
    environment:
      CHOKIDAR_USEPOLLING: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../service/mcp:/workspace/service/mcp:delegated
      - ../service/registry:/workspace/service/registry:delegated
      - ../data:/workspace/data:delegated

  api:
    init: true
    tty: true
    stdin_open: true
    stop_grace_period: 5s
