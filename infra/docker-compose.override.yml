    volumes:
      - ../service/webapp/knowledge-manager:/workspace/service/webapp/knowledge-manager:delegated
      - ../data:/workspace/data:delegated

  registry-graph:
    init: true
    tty: true
    stdin_open: true
    stop_grace_period: 5s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  registry:
