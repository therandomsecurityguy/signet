# Per-env overrides for the Signet chart (prod, served at the zone apex).
# Non-secret values are set here; secrets live in the signet-owned Secrets
# Manager prefix and are injected by ESO via IRSA; never committed.

image:
  registry: <account>.dkr.ecr.us-west-2.amazonaws.com

api:
  image:
    repository: signet/api

mcp:
  image:
    repository: signet/mcp

webapp:
  image:
    repository: signet/webapp

tesseraSidecar:
  image:
    repository: signet/tessera-sidecar

auth:
  mode: okta
  oktaMode: real
  oktaIssuer: <okta-issuer>
  oktaAudience: https://signet.internal.example.com
  oktaClientId: <okta-client-id>
  oktaRedirectUri: https://signet.internal.example.com/session/callback
  oktaScopes: "openid profile email groups offline_access"
  oktaAdminGroups: app_signet_admin
  corsAllowedOrigins: "https://signet.internal.example.com"

artifacts:
  backend: s3
  s3:
    bucket: <artifacts-bucket>
    prefix: signet/prod
    region: us-west-2

secrets:
  create: false
  name: signet
  external:
    enabled: true
    createSecretStore: true
    prefix: signet-prod/runtime

serviceAccount:
  roleArn: <irsa-role-arn>

ingress:
  enabled: true
  className: alb
  host: signet.internal.example.com
  tls: true
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip

networkPolicies:
  enabled: true
  # VPC CIDRs hosting RDS/ElastiCache/VPC endpoints; filled by tf-io-sec.
  egressCidrs:
    - cidr: <vpc-cidr>
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379

metrics:
  serviceMonitor:
    enabled: true