# Local, no-AWS overlay: run the real chart on a local cluster (kind/k3d)
# without AWS, ECR, External Secrets, or IRSA.
#
# NEVER deploy this overlay to a shared or production cluster: it runs mock
# Okta (any bearer token acts as an admin) and development Node modes. Real
# environments use values-<env>.yaml with AUTH_MODE=okta|dual and NODE_ENV
# production (the apps reject mock auth under production by design).
#
# What this changes relative to values.yaml:
# - workloads run with NODE_ENV=development so the local auth modes
#   (api_key for machines, mock Okta for humans) are permitted
# - SQLite database + filesystem CAS (both on the chart's writable
#   /workspace/data emptyDir) instead of Postgres/S3
# - chart-managed Secret with dev values instead of ESO/Secrets Manager
# - the tessera sidecar and watchdog/backup CronJobs are disabled (they
#   expect a shared S3-backed transparency log; the registry works
#   without them, reconciliation simply reports unavailable)
# - no ingress, no NetworkPolicies: reach the services via port-forward
#
# Images must be built locally and loaded into the cluster first:
#   docker build -f service/api/Dockerfile -t signet/api:dev .
#   docker build -f service/mcp/Dockerfile -t signet/mcp:dev .
#   docker build -f service/webapp/knowledge-manager/Dockerfile -t signet/webapp-knowledge-manager:dev .
#   kind load docker-image signet/api:dev signet/mcp:dev signet/webapp-knowledge-manager:dev
#
# Then:
#   helm install signet charts/signet -f charts/signet/values-local.yaml --namespace signet --create-namespace
#   kubectl -n signet port-forward svc/signet-api 3100:3100
#   kubectl -n signet port-forward svc/signet-mcp 3000:3000
#   kubectl -n signet port-forward svc/signet-webapp 3200:3200
#
# See docs/local-demo.md for the full walkthrough (including seeding the
# demo pack with registry-operator).

env: local
runtimeNodeEnv: development

# api + mcp share one data volume: the filesystem CAS written by the
# management plane must be readable by the MCP plane (single-node cluster).
persistence:
  enabled: true
  size: 1Gi

image:
  pullPolicy: IfNotPresent

api:
  image:
    repository: signet/api
    tag: dev
  env:
    # Separate SQLite files on the shared volume (the chart's default
    # database-url secret is shared by both planes).
    DATABASE_URL: file:/workspace/data/registry/signet-api.db

mcp:
  image:
    repository: signet/mcp
    tag: dev
  env:
    DATABASE_URL: file:/workspace/data/registry/signet-mcp.db
    # Warehouse connectors run in mock mode for the local demo:
    # data.list_tables / data.describe_table / data.query return
    # deterministic samples for all three approved sources, and
    # GET /v1/data-sources reports them ready. See docs/mcp-data-access.md
    # to wire real sources in a non-demo environment.
    SNOWFLAKE_MODE: mock
    ATHENA_MODE: mock
    MOTHERDUCK_MODE: mock

webapp:
  image:
    repository: signet/webapp-knowledge-manager
    tag: dev
  # Browse the API docs / MCP endpoint through the port-forwards.
  apiDocsUrl: http://localhost:3100/v1/docs
  mcpUrl: http://localhost:3000/mcp

auth:
  # Machines use API keys; humans use the mock Okta session flow.
  mode: dual
  oktaMode: mock
  # The webapp validates these as URLs even in mock mode; any valid URL works.
  oktaIssuer: http://localhost:3201/oauth2/default
  oktaAudience: http://localhost:3100
  oktaClientId: local-demo
  oktaRedirectUri: http://localhost:3200/session/callback

artifacts:
  # Filesystem CAS on the /workspace/data emptyDir (ephemeral demo state).
  backend: fs

keyless:
  enabled: false

tesseraSidecar:
  enabled: false

sidecarWatchdog:
  enabled: false

fusekiBackup:
  enabled: false

ingress:
  enabled: false

networkPolicies:
  enabled: false

metrics:
  prometheusScrape: false

secrets:
  create: true
  databaseUrl: file:/workspace/data/signet.db
  fusekiAdminPassword: admin
  redisUrl: ""
  apiKeyPepper: local-dev-pepper
