{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "signet.labels" . | nindent 4 }}
type: Opaque
stringData:
  okta-client-secret: {{ .Values.secrets.oktaClientSecret | quote }}
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  fuseki-admin-password: {{ .Values.secrets.fusekiAdminPassword | quote }}
  redis-url: {{ .Values.secrets.redisUrl | quote }}
  api-key-pepper: {{ .Values.secrets.apiKeyPepper | quote }}
  tessera-log-private-key: {{ .Values.secrets.tesseraLogPrivateKey | quote }}
  tessera-sidecar-auth-token: {{ .Values.secrets.tesseraSidecarAuthToken | quote }}
  shacl-runtime-token: {{ .Values.secrets.shaclRuntimeToken | quote }}
{{- end }}
