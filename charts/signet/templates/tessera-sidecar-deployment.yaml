{{- if .Values.tesseraSidecar.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signet.fullname" . }}-tessera-sidecar
  labels:
    {{- include "signet.labels" . | nindent 4 }}
    app.kubernetes.io/component: tessera-sidecar
spec:
  replicas: {{ .Values.tesseraSidecar.replicas | default .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "signet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tessera-sidecar
  template:
    metadata:
      labels:
        {{- include "signet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tessera-sidecar
      {{- if .Values.metrics.prometheusScrape }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.tesseraSidecar.port }}"
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: tessera-sidecar
          image: {{ include "signet.image" (dict "repository" .Values.tesseraSidecar.image.repository "tag" .Values.tesseraSidecar.image.tag "digest" .Values.tesseraSidecar.image.digest "registry" .Values.image.registry "Chart" .Chart) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.tesseraSidecar.port }}
          env:
            - name: PORT
              value: {{ .Values.tesseraSidecar.port | quote }}
            - name: NODE_ENV
              value: production
            {{- if .Values.tesseraSidecar.logPrivateKeyFromSecret }}
            - name: TESSERA_LOG_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: tessera-log-private-key
            {{- end }}
            {{- if .Values.tesseraSidecar.logOrigin }}
            - name: TESSERA_LOG_ORIGIN
              value: {{ .Values.tesseraSidecar.logOrigin | quote }}
            {{- end }}
            # Shared bearer token for /v1/* calls; auth is fail-closed, so a
            # deployment without it must set the local-dev opt-out below.
            - name: TESSERA_SIDECAR_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: tessera-sidecar-auth-token
                  optional: true
            {{- if .Values.tesseraSidecar.allowUnauthenticated }}
            - name: TESSERA_SIDECAR_ALLOW_UNAUTHENTICATED
              value: "true"
            {{- end }}
            {{- if .Values.artifacts.s3.bucket }}
            # Default to the artifact bucket/prefix (covered by the IRSA role).
            - name: TESSERA_SIDECAR_BUCKET
              value: {{ .Values.artifacts.s3.bucket | quote }}
            - name: TESSERA_SIDECAR_REGION
              value: {{ .Values.artifacts.s3.region | quote }}
            - name: TESSERA_SIDECAR_TILES_PREFIX
              value: {{ printf "%s/tessera/tiles/%s" .Values.artifacts.s3.prefix .Values.env | quote }}
            - name: TESSERA_SIDECAR_REQUESTS_PREFIX
              value: {{ printf "%s/tessera/requests/%s" .Values.artifacts.s3.prefix .Values.env | quote }}
            {{- end }}
            {{- range $k, $v := .Values.tesseraSidecar.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
{{- end }}
