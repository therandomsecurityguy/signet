{{- if and .Values.tesseraSidecar.enabled .Values.sidecarWatchdog.enabled }}
# In-cluster watchdog for the tessera-sidecar: publishes Signet/Watchdog/
# SidecarHealthy for the Terraform alarm. The alarm treats missing data as
# breaching, so a stopped CronJob is an alert too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "signet.fullname" . }}-sidecar-watchdog
  labels:
    {{- include "signet.labels" . | nindent 4 }}
    app.kubernetes.io/component: tessera-sidecar-watchdog
spec:
  schedule: {{ .Values.sidecarWatchdog.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            {{- include "signet.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: tessera-sidecar-watchdog
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              image: {{ include "signet.image" (dict "repository" .Values.tesseraSidecar.image.repository "tag" .Values.tesseraSidecar.image.tag "digest" .Values.tesseraSidecar.image.digest "registry" .Values.image.registry "Chart" .Chart) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["node", "dist/src/watchdog-main.js"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              env:
                - name: TESSERA_SIDECAR_WATCHDOG_URL
                  value: {{ printf "http://%s-tessera-sidecar:%v" (include "signet.fullname" .) .Values.tesseraSidecar.port | quote }}
                - name: TESSERA_SIDECAR_REGION
                  value: {{ .Values.artifacts.s3.region | quote }}
                - name: TESSERA_SIDECAR_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.name }}
                      key: tessera-sidecar-auth-token
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
