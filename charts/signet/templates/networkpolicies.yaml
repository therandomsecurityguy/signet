{{- if .Values.networkPolicies.enabled }}
{{- $components := list "api" "mcp" "webapp" "tessera-sidecar" }}
{{- range $component := $components }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "signet.fullname" $ }}-{{ $component }}-egress
  labels:
    {{- include "signet.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      {{- include "signet.componentSelectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            {{- toYaml $.Values.networkPolicies.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $.Values.networkPolicies.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if ne $component "webapp" }}
    # In-cluster Fuseki (SPARQL query/update).
    - to:
        - podSelector:
            matchLabels:
              {{- include "signet.componentSelectorLabels" (dict "root" $ "component" "fuseki") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.fuseki.port }}
    {{- end }}
    {{- if eq $component "webapp" }}
    # Webapp proxies the management API.
    - to:
        - podSelector:
            matchLabels:
              {{- include "signet.componentSelectorLabels" (dict "root" $ "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.api.port }}
    {{- end }}
    # HTTPS egress: Okta, S3 SDK, witnesses, cognitive-layer HTTP seam.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Managed AWS services reached by IP (Postgres, Redis, VPC endpoints).
    {{- range $.Values.networkPolicies.egressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
            {{- with .except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
---
{{- end }}
# Fuseki is the metadata store: only in-cluster stateless workloads may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "signet.fullname" . }}-fuseki-ingress
  labels:
    {{- include "signet.labels" . | nindent 4 }}
    app.kubernetes.io/component: fuseki
spec:
  podSelector:
    matchLabels:
      {{- include "signet.componentSelectorLabels" (dict "root" . "component" "fuseki") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "signet.componentSelectorLabels" (dict "root" . "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "signet.componentSelectorLabels" (dict "root" . "component" "mcp") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "signet.componentSelectorLabels" (dict "root" . "component" "tessera-sidecar") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.fuseki.port }}
---
# The Tessera sidecar only serves Signet workloads: the api stages append
# intents and reconciles native-log entries, and the mcp read plane may verify
# against it. Enforced together with TESSERA_SIDECAR_AUTH_TOKEN.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "signet.fullname" . }}-tessera-sidecar-ingress
  labels:
    {{- include "signet.labels" . | nindent 4 }}
    app.kubernetes.io/component: tessera-sidecar
spec:
  podSelector:
    matchLabels:
      {{- include "signet.componentSelectorLabels" (dict "root" . "component" "tessera-sidecar") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "signet.componentSelectorLabels" (dict "root" . "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "signet.componentSelectorLabels" (dict "root" . "component" "mcp") | nindent 14 }}
        {{- if .Values.sidecarWatchdog.enabled }}
        - podSelector:
            matchLabels:
              {{- include "signet.componentSelectorLabels" (dict "root" . "component" "tessera-sidecar-watchdog") | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.tesseraSidecar.port }}
    {{- if .Values.networkPolicies.metricsNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.metricsNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.tesseraSidecar.port }}
    {{- end }}
{{- end }}