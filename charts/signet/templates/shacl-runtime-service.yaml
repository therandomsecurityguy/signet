{{- if .Values.shaclRuntime.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "signet.fullname" . }}-shacl-runtime
  labels:
    {{- include "signet.labels" . | nindent 4 }}
    app.kubernetes.io/component: shacl-runtime
spec:
  type: ClusterIP
  selector:
    {{- include "signet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: shacl-runtime
  ports:
    - name: http
      port: {{ .Values.shaclRuntime.port }}
      targetPort: http
{{- end }}
