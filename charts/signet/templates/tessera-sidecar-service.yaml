{{- if .Values.tesseraSidecar.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "signet.fullname" . }}-tessera-sidecar
  labels:
    {{- include "signet.labels" . | nindent 4 }}
    app.kubernetes.io/component: tessera-sidecar
spec:
  type: ClusterIP
  selector:
    {{- include "signet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tessera-sidecar
  ports:
    - name: http
      port: {{ .Values.tesseraSidecar.port }}
      targetPort: http
{{- end }}
