{{- if .Values.fuseki.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "signet.fullname" . }}-fuseki
  labels:
    {{- include "signet.labels" . | nindent 4 }}
    app.kubernetes.io/component: fuseki
spec:
  serviceName: {{ include "signet.fullname" . }}-fuseki
  replicas: 1
  selector:
    matchLabels:
      {{- include "signet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: fuseki
  template:
    metadata:
      labels:
        {{- include "signet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fuseki
    spec:
      # The fuseki user (uid 8983) owns the data volume. A one-shot init
      # container chowns the PVC so the entrypoint can copy shiro.ini into it
      # without running the workload as root.
      securityContext:
        runAsUser: 8983
        runAsGroup: 8983
        fsGroup: 8983
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: volume-permissions
          image: {{ if .Values.fuseki.image.digest }}{{ .Values.fuseki.image.repository }}@{{ .Values.fuseki.image.digest }}{{ else }}{{ .Values.fuseki.image.repository }}:{{ .Values.fuseki.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "chown -R 8983:8983 /fuseki"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /fuseki
      containers:
        - name: fuseki
          image: {{ if .Values.fuseki.image.digest }}{{ .Values.fuseki.image.repository }}@{{ .Values.fuseki.image.digest }}{{ else }}{{ .Values.fuseki.image.repository }}:{{ .Values.fuseki.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.fuseki.port }}
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: fuseki-admin-password
            # The entrypoint creates this dataset (TDB) on startup; the api/mcp
            # services query /<name>/sparql and /<name>/update.
            - name: FUSEKI_DATASET_1
              value: {{ .Values.fuseki.datasetName | quote }}
            - name: TDB
              value: "2"
            {{- if .Values.fuseki.jvmArgs }}
            - name: JVM_ARGS
              value: {{ .Values.fuseki.jvmArgs | quote }}
            {{- end }}
          resources:
            {{- toYaml (.Values.fuseki.resources | default .Values.resources) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /$/ping
              port: http
          livenessProbe:
            httpGet:
              path: /$/ping
              port: http
          volumeMounts:
            - name: data
              mountPath: /fuseki
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.fuseki.persistence.storageClass }}
        storageClassName: {{ .Values.fuseki.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.fuseki.persistence.size }}
{{- end }}
