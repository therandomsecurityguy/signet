{{- if .Values.fuseki.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cachet.fullname" . }}-fuseki
  labels:
    {{- include "cachet.labels" . | nindent 4 }}
    app.kubernetes.io/component: fuseki
spec:
  type: ClusterIP
  selector:
    {{- include "cachet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: fuseki
  ports:
    - name: http
      port: {{ .Values.fuseki.port }}
      targetPort: http
{{- end }}
