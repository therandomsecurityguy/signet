{{- if .Values.webapp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cachet.fullname" . }}-webapp
  labels:
    {{- include "cachet.labels" . | nindent 4 }}
    app.kubernetes.io/component: webapp
spec:
  type: ClusterIP
  selector:
    {{- include "cachet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: webapp
  ports:
    - name: http
      port: {{ .Values.webapp.port }}
      targetPort: http
{{- end }}
