{{- if .Values.secrets.external.enabled }}
{{- $store := include "cachet.secretStoreName" . }}
{{- $prefix := include "cachet.secretsPrefix" . }}
{{- if .Values.secrets.external.createSecretStore }}
# Namespace-scoped SecretStore owned by this release. Authenticates to AWS
# Secrets Manager via IRSA (JWT of the release service account) — no
# platform-provisioned store, no static credentials in the chart.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $store }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cachet.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secrets.external.region | default .Values.artifacts.s3.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.secrets.external.serviceAccountName }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cachet.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $store }}
    kind: SecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: okta-client-secret
      remoteRef:
        key: {{ $prefix }}/okta-client-secret
    - secretKey: database-url
      remoteRef:
        key: {{ $prefix }}/database-url
    - secretKey: fuseki-admin-password
      remoteRef:
        key: {{ $prefix }}/fuseki-admin-password
    - secretKey: redis-url
      remoteRef:
        key: {{ $prefix }}/redis-url
    - secretKey: api-key-pepper
      remoteRef:
        key: {{ $prefix }}/api-key-pepper
    - secretKey: tessera-log-private-key
      remoteRef:
        key: {{ $prefix }}/tessera-log-private-key
    # Seed {{ $prefix }}/tessera-sidecar-auth-token to enforce sidecar auth;
    # pods tolerate the key being absent (sidecar runs unauthenticated).
    - secretKey: tessera-sidecar-auth-token
      remoteRef:
        key: {{ $prefix }}/tessera-sidecar-auth-token
{{- end }}