{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "cachet.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    # IRSA: binds this service account to the cachet-owned IAM role provisioned
    # by the deploy/terraform modules. Used for Secrets Manager access (ESO JWT
    # auth) and any AWS SDK calls without static credentials.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
  {{- end }}
{{- end }}